description: The assistant's VM (pa-home)
config:
  limits.cpu: "4"
  limits.memory: 6GiB
  boot.autostart: "true"
  cloud-init.user-data: |
    #cloud-config
    # Two unprivileged users and no default ubuntu user. Nothing reaches the VM but `incus exec`
    # on the devbox: it has no Tailscale (#91). The capture user (#94) owns the chat inbox and
    # writes it only through the capture helper; it has the devbox user's uid, 1000, since the
    # inbox share keeps owners unmapped (create-vm.sh checks it). So it comes first, and the
    # assistant has a uid of its own (PA_VM_ASSISTANT_UID).
    users:
      - name: capture
        gecos: PA exchange capture
        uid: 1000
        shell: /usr/sbin/nologin
        homedir: /nonexistent
        no_create_home: true
        lock_passwd: true
      - name: assistant
        gecos: PA assistant
        uid: 1001
        shell: /bin/bash
        lock_passwd: true
    # pin-hosts.sh writes the API's names into /etc/hosts at each start: the bridge has no DNS.
    manage_etc_hosts: false
    # The only time the VM reaches a package mirror: create-vm.sh builds it on the open build
    # bridge, and fence-vm.sh fences it before anything is mounted. The OS is refreshed by
    # rebuilding it; install-assistant-fences.sh masks apt's own timers.
    package_update: true
    package_upgrade: true
    packages:
      - ca-certificates
      # The isolation check's probes.
      - curl
      # The code's checkout, from the bundle update.sh pushes.
      - git
      # Claude Code's Bash sandbox, and AppArmor, whose pa-bwrap profile lets bubblewrap run
      # (install-assistant-fences.sh).
      - bubblewrap
      - socat
      - apparmor
      # The capture hooks reach the capture helper through sudo (#94).
      - sudo
devices:
  root:
    type: disk
    path: /
    pool: pa
    size: 40GiB
  eth0:
    type: nic
    name: eth0
    network: pabr0
    # The fence: the egress ACL's one rule (TCP 443 to the API's range), and everything else
    # dropped and logged, both ways. create-vm.sh shadows this NIC with one on the build bridge
    # until fence-vm.sh removes it.
    security.acls: pa-home-egress
    security.acls.default.egress.action: drop
    security.acls.default.egress.logged: "true"
    security.acls.default.ingress.action: drop
    security.acls.default.ingress.logged: "true"

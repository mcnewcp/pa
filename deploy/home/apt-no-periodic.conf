// The assistant's VM reaches only the Anthropic API (#91): apt never refreshes its lists or
// upgrades on its own. The OS is refreshed by rebuilding the VM (deploy/home/README.md).
APT::Periodic::Enable "0";
APT::Periodic::Update-Package-Lists "0";
APT::Periodic::Download-Upgradeable-Packages "0";
APT::Periodic::Unattended-Upgrade "0";

      - hotel-confirmation
      - gift-fix
      - swim-deadline-fix  # the Oct 5 note as corrected, which says they drive up Friday
      - dave-reading-request

  - id: basement-stands
    category: where_things_stand
    question: Where do things stand with the basement?
    expected_answer: >-
      Finished, and the insurance claim is closed. Birchwood rebuilt it from June 22 to July 10
      with a vinyl plank floor, new drywall, paint, and baseboards, for $12,100 including $2,300
      of mold removal, paid in full. Great Plains Mutual closed claim GP-26-118734 on August 4,

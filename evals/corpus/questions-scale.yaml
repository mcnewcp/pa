      about $4,500 more to move it to the island, five to six weeks, starting the week of
      November 16. Decided: the sink moves to an island (Mara's idea). Open: on September 28
      Argus asked Rick for a revised quote with the island sink and a butcher-block island top;
      Rick promised it by October 2 but never sent it, and hasn't answered Argus's October 8
      follow-up. So as of October 13 Argus and Mara are leaning toward Birchwood, even though it
      costs more, and need to decide before its estimate lapses.
    evidence:
      - birchwood-quote
      - rick-quote
      - argus-revision-request
      - rick-revision-promise
      - kitchen-note-birchwood

  - id: swim-stands
    category: where_things_stand
    question: Where are we with swim lessons for the kids?
    expected_answer: >-
      Decided, but the kids aren't registered yet. They're going with the Westside YMCA's
      Saturday 9:00-9:45 am classes (October 24 to December 12, $90 per child), with Mara taking
      both kids while Argus is at soccer. They first leaned toward Tuesday and Thursday at 5:30,
      but switched on October 5 because Mara's late shifts move to Tuesdays and Thursdays from the
      week of October 19. The YMCA confirmed on October 7 that both can swim at the same time,
      June in Preschool 1 and Theo in Level 3 (he passed Level 2), with 4 and 6 spots left that
      morning and no spot held until registration is done. Open: Argus said he'd register them,
      and registration closes this Friday, October 16 at 5 pm; nothing shows he has. Worth
      knowing: the first class, October 24, is Dave's wedding day, when Argus and Mara are in
      Duluth and Mara's parents have the kids, and Nora's birthday party on November 14 at 9:30
      overlaps June's class.
    evidence: [ymca-registration, swim-deadline-fix, ymca-answer]

  - id: wedding-stands
    category: where_things_stand
    question: Where do things stand for Dave's wedding?
    expected_answer: >-
      Dave and Priya marry Saturday, October 24 at 4 pm at North Shore Lodge in Duluth. Done:
      Argus RSVP'd yes for both of them on September 20 (Mara the salmon, Argus the short rib);

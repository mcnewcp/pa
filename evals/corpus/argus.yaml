# The storyline spec of the synthetic corpus: six weeks (Sep 7 - Oct 14, 2026) in the fictional
# life of Argus McNevans (he/him). It is the ground truth for the eval set
# (evals/corpus/questions.yaml).
#
# The frozen payloads in evals/corpus/payloads/ were generated from this file with
#   uv run pa-eval corpus generate evals/corpus/argus.yaml evals/corpus/payloads --model sonnet
# and then read by hand. Two lines of prose were fixed by hand after generation: the hotel
# confirmation's greeting ("Dear Gus" became "Dear Argus McNevans") and a stray email address
# at the end of the Sep 15 note's Kitchen section. Change this file only together with a
# regenerated (and re-read) corpus and a rebuilt eval set (uv run pa-eval eval-set build).
#
# Everything in the corpus happens before the eval set's as-of time, Wednesday Oct 14, 2026 at
# 8 pm. Calendar events may lie after it; they were added to the calendar before it.
#
# Family: Argus and his wife Mara (a hospitalist who works late shifts), and their kids Theo (7)
# and June (4). They live in Minneapolis.


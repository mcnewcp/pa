  - id: kitchen
    title: Kitchen remodel
    summary: >-
      Argus and Mara McNevans are getting quotes to remodel their kitchen, from Rick Alvarez of
      Alvarez Kitchen & Bath and from Hannah Lee of Birchwood Remodeling.
    events:
      - id: kitchen-quote-request
        channel: email
        at: 2026-09-08T12:15:00
        from: argus
        to: [rick]
        cc: [mara]
        subject: Kitchen remodel quote
        what: >-
          Argus says a neighbor recommended Rick, and asks for a quote to remodel their kitchen:
          new cabinets, quartz countertops, and new flooring, keeping the current layout. He
          asks when Rick could come by to see the space; weekday evenings after 6 work best.
      - id: kitchen-visit-reply
        channel: email
        at: 2026-09-09T07:45:00
        from: rick
        to: [argus]
        cc: [mara]
        reply_to: kitchen-quote-request
        what: >-
          Rick thanks Argus and offers to come by Tuesday, September 15 at 6:00 pm to look at
          the kitchen and take measurements. He'll have a written quote about a week after the
          visit.
      - id: kitchen-site-visit
        channel: calendar
        at: 2026-09-09T20:30:00
        calendar: family
        title: "Kitchen site visit: Rick Alvarez"
        start: 2026-09-15T18:00:00
        end: 2026-09-15T19:00:00
        location: Home
        description: Alvarez Kitchen & Bath walkthrough and measurements.
        organizer: argus
        attendees: [rick, mara]
        what: Rick visits to see the kitchen and measure.
      - id: kitchen-note-visit
        channel: note
        date: 2026-09-15
        heading: Kitchen
        participants: [rick, mara]
        what: >-
          Rick came by at 6 and measured the kitchen. Mara wants to move the sink to a new
          island; Rick said that's doable but adds plumbing and electrical cost. He'll email a
          written quote in about a week.
      - id: birchwood-quote
        channel: email
        at: 2026-09-21T10:30:00
        from: hannah
        to: [argus]
        subject: "Birchwood Remodeling: your kitchen estimate"
        what: >-
          Hannah, following up on the photos and measurements Argus submitted through
          Birchwood's website, sends an estimate of $44,900 for new cabinets, quartz
          countertops, new flooring, and moving the sink to a new island. The work would take
          about eight weeks, and Birchwood's next opening is in January. The estimate is good
          for 30 days.
      - id: rick-quote
        channel: email
        at: 2026-09-23T16:40:00
        from: rick
        to: [argus]
        cc: [mara]
        subject: "Quote: McNevans kitchen"
        what: >-
          Rick sends his quote: $38,400 for new cabinets, quartz countertops, and new flooring,
          with the sink staying where it is. Moving the sink to an island would add about
          $4,500 for plumbing and electrical. The job would take five to six weeks, and he could
          start the week of November 16.
      - id: kitchen-note-compare
        channel: note
        date: 2026-09-24
        heading: Kitchen
        participants: [mara, rick, hannah]
        what: >-
          Compared the two quotes: Rick $38,400 (about $42,900 with the sink moved to the
          island) vs. Birchwood $44,900 with the island sink. Mara and Argus are leaning toward
          Rick: cheaper, and he can start sooner. Argus wants to ask Rick for a revised number
          with a butcher-block top on the island instead of quartz, to save money.
      - id: argus-revision-request
        channel: email
        at: 2026-09-28T08:05:00
        from: argus
        to: [rick]
        cc: [mara]
        reply_to: rick-quote
        what: >-
          Argus thanks Rick and says they'd like to move the sink to the island. He asks for a
          revised quote that includes the island sink and uses a butcher-block countertop on the
          island, keeping quartz on the perimeter counters.
      - id: rick-revision-promise
        channel: email
        at: 2026-09-29T18:20:00
        from: rick
        to: [argus]
        cc: [mara]
        reply_to: argus-revision-request
        what: Rick says no problem, and he'll send the revised quote by this Friday, October 2.
      - id: argus-rick-nudge
        channel: email
        at: 2026-10-08T12:30:00
        from: argus
        to: [rick]
        cc: [mara]
        reply_to: rick-revision-promise
        what: >-
          Argus follows up politely: he hasn't received the revised quote Rick said he'd send by
          last Friday, October 2, and asks whether Rick can still send it.
      - id: kitchen-note-birchwood
        channel: note
        date: 2026-10-13
        heading: Kitchen
        participants: [mara, rick, hannah]
        what: >-
          Still no revised quote from Rick, and no reply to Argus's Oct 8 follow-up. Mara and
          Argus are now leaning toward Birchwood even though it costs more; they'd rather have a
          contractor who responds. Birchwood's estimate is good until about Oct 21.


      # The stance change and the open loop. The note gets the deadline wrong (Oct 9 is the
      # hotel block deadline for Dave's wedding) and is corrected two days later.
      - id: swim-note-saturdays
        channel: note
        date: 2026-10-05
        heading: Swim lessons
        participants: [mara]
        what: >-
          The hospital is moving Mara's late shifts to Tuesday and Thursday starting the week of
          Oct 19, so she can't do the Tuesday/Thursday 5:30 class anymore. Mara now wants the
          Saturday 9 am class instead, and she'll take both kids on Saturday mornings while
          Argus is at soccer. Argus will register Theo and June for the Saturday class before
          the registration deadline, Friday Oct 9.
      - id: ymca-question
        channel: email
        at: 2026-10-06T12:10:00
        from: argus
        to: [ymca]
        cc: [mara]
        reply_to: ymca-registration
        what: >-
          Argus asks whether Theo (7) and June (4) can both be in Saturday 9:00 classes at the
          same time, whether there are still spots in the Saturday preschool class, and which
          level Theo should sign up for, since he finished Level 2 last spring.
      - id: ymca-answer
        channel: email
        at: 2026-10-07T09:30:00
        from: ymca
        to: [argus]
        cc: [mara]
        reply_to: ymca-question
        what: >-
          Yes: Preschool 1 and Level 3 both meet Saturdays 9:00-9:45 am in the same pool, in
          separate lanes, so both kids can swim at the same time. As of this morning there are
          4 spots left in Saturday Preschool 1 and 6 in Saturday Level 3. Since Theo passed
          Level 2, he should register for Level 3. Registration still closes Friday, October 16
          at 5:00 pm, and spots are not held until registration is complete. Sign it as the
          Westside YMCA Aquatics team, with no individual staff names.
      - id: swim-deadline-fix
        channel: note_correction
        at: 2026-10-07T08:10:00
        corrects: swim-note-saturdays
        what: >-
          The registration deadline is Friday Oct 16 at 5 pm, not Oct 9 (Oct 9 is the hotel
          block deadline for Dave's wedding).


      # Swim lessons: the options and the first preference.
      - id: ymca-registration
        channel: email
        at: 2026-09-14T10:00:00
        from: ymca
        to: [argus, mara]
        subject: "Fall II youth swim lessons: registration is open"
        what: >-
          The Westside YMCA announces that registration for Fall II youth swim lessons is open
          now and closes Friday, October 16 at 5:00 pm. Preschool levels (ages 3-5) and Levels
          1-4 (ages 6-12) are offered at two times: Tuesday and Thursday 5:30-6:15 pm (classes
          run October 20 to December 10, $160 per child) or Saturday 9:00-9:45 am (classes run
          October 24 to December 12, $90 per child). Members register in the online member
          portal. Classes fill quickly. Sign it as the Westside YMCA Aquatics team, with no
          individual staff names.
      - id: swim-note-weekdays
        channel: note
        date: 2026-09-15
        heading: Swim lessons
        participants: [mara]
        what: >-
          Talked with Mara about the YMCA swim lesson options for Theo and June. Mara prefers
          the Tuesday/Thursday 5:30 pm class: her late shifts are Monday, Wednesday and Friday,
          so she's free to take the kids on Tuesday and Thursday evenings, and it keeps Saturday
          mornings clear for Argus's soccer. They're leaning toward Tuesday/Thursday.


storylines:
  # ---------------------------------------------------------------------------------------------
  - id: van
    title: Replacing the minivan
    summary: >-
      Argus and Mara McNevans's 2016 Honda Odyssey gets a recall repair in May, when the
      dealership warns that its transmission is starting to fail. Over the summer they decide to
      replace it: they buy a used 2022 Toyota Sienna from Northland Toyota, and sell the Odyssey
      to Jerome Wells, the brother of their friend Tasha Okafor (Okie's wife).
    events:
      - id: van-recall-notice
        channel: email
        at: 2026-04-23T11:00:00
        from: lakes-honda
        to: [argus]
        category: updates
        subject: "Safety recall: your 2016 Odyssey"
        what: >-
          A recall notice from Lakes Honda Service: Argus's 2016 Honda Odyssey is part of a
          safety recall for the power sliding door latch, which can fail to latch. The repair is
          free; call or email to book it. Sign it as Lakes Honda Service, with no individual
          staff names.
      - id: van-book-recall
        channel: email
        at: 2026-05-04T08:15:00
        from: argus
        to: [lakes-honda]
        subject: Recall repair and oil change
        what: >-
          Argus asks to book the sliding door recall repair for his 2016 Odyssey, together with
          an oil change. A weekday morning drop-off works best.
      - id: van-recall-booked
        channel: email
        at: 2026-05-05T09:40:00
        from: lakes-honda
        to: [argus]
        reply_to: van-book-recall
        what: >-
          Lakes Honda books Thursday, May 14 at 7:30 am for the recall repair and an oil change,
          about three hours. Sign it as Lakes Honda Service, with no individual staff names.
      - id: van-service
        channel: calendar
        at: 2026-05-05T09:50:00
        calendar: personal
        title: "Van: recall repair + oil change (Lakes Honda)"
        start: 2026-05-14T07:30:00
        end: 2026-05-14T10:30:00
        location: Lakes Honda
        organizer: argus
        what: The van's recall repair and oil change.
      - id: van-service-reminder
        channel: email
        at: 2026-05-13T10:00:00
        from: lakes-honda
        to: [argus]
        category: updates
        subject: "Reminder: your service appointment tomorrow"
        what: >-
          An automated reminder from Lakes Honda Service: the 2016 Odyssey's appointment is
          tomorrow, Thursday May 14, at 7:30 am. Sign it as Lakes Honda Service, with no
          individual staff names.
      - id: van-service-summary
        channel: email
        at: 2026-05-14T10:50:00
        from: lakes-honda
        to: [argus]
        category: updates
        subject: "Your service summary: 2016 Odyssey"
        what: >-
          Lakes Honda's service summary: the sliding door recall repair and the oil change are
          done, at 128,400 miles. The technician noted dark transmission fluid and a shudder
          from the transmission at low speeds; it will likely need replacing eventually, which
          typically runs $4,000 to $5,000. Sign it as Lakes Honda Service, with no individual
          staff names.
      - id: van-transmission-note
        channel: note
        date: 2026-05-14
        heading: Van
        what: >-
          Van's recall repair is done. Lakes Honda says the transmission shudders and will
          probably need replacing at some point, $4,000 to $5,000. At 128,000 miles, maybe it's
          time to replace the van this fall instead.
      - id: van-decision-note
        channel: note
        date: 2026-07-20
        heading: Van
        participants: [mara]
        what: >-
          The van shuddered badly on the freeway today. Mara and Argus agree: replace it before
          winter. Looking at a used Toyota Sienna.
      - id: van-oil-reminder
        channel: email
        at: 2026-08-03T09:30:00
        from: lakes-honda
        to: [argus]
        category: updates
        subject: "Your Odyssey is due for an oil change"
        what: >-
          An automated note from Lakes Honda Service that the 2016 Odyssey is due for its next
          oil change, with a link to book online. Sign it as Lakes Honda Service, with no
          individual staff names.
      - id: van-test-drive
        channel: calendar
        at: 2026-08-04T12:00:00
        calendar: personal
        title: "Test drive: Sienna (Northland Toyota)"
        start: 2026-08-06T17:30:00
        end: 2026-08-06T18:30:00
        location: Northland Toyota
        organizer: argus
        attendees: [mara]
        what: Argus and Mara test-drive a used Sienna.
      - id: van-sienna-offer
        channel: email
        at: 2026-08-06T20:00:00
        from: megan
        to: [argus]
        cc: [mara]
        subject: The Sienna you drove tonight
        what: >-
          Megan Doyle, a sales consultant at Northland Toyota, thanks Argus and Mara for the
          test drive. The 2022 Sienna XLE has 28,000 miles and is $36,500. She can hold it with
          a $500 deposit.
      - id: van-sienna-deposit
        channel: email
        at: 2026-08-07T07:45:00
        from: argus
        to: [megan]
        cc: [mara]
        reply_to: van-sienna-offer
        what: >-
          Argus says they'll take the Sienna and he paid the $500 deposit online. They'd like to
          pick it up around the middle of September, after they're back from vacation and have
          sold their old van.
      - id: van-sienna-pickup-set
        channel: email
        at: 2026-08-07T10:30:00
        from: megan
        to: [argus]
        cc: [mara]
        reply_to: van-sienna-deposit
        what: >-
          Megan confirms the deposit and sets the pickup for Thursday, September 17 at 5:00 pm.
      - id: van-sienna-pickup
        channel: calendar
        at: 2026-08-07T10:45:00
        calendar: family
        title: Pick up the Sienna (Northland Toyota)
        start: 2026-09-17T17:00:00
        end: 2026-09-17T18:00:00
        location: Northland Toyota
        organizer: argus
        attendees: [mara]
        what: Argus and Mara pick up their new van.
      - id: van-jerome-offer
        channel: email
        at: 2026-08-24T20:20:00
        from: argus
        to: [jerome]
        subject: Our Odyssey
        what: >-
          Argus writes to Jerome Wells: Okie mentioned at the cabin that Jerome is looking for a
          minivan. Theirs is a 2016 Honda Odyssey with 131,000 miles; to be upfront, the
          transmission shudders and will need work eventually. They're asking $9,500, and Jerome
          is welcome to come see it.
      - id: van-mileage-chat
        channel: assistant_chat
        at: 2026-08-24T20:35:00
        what: >-
          Argus tells the assistant he has offered the old Odyssey to Jerome Wells for $9,500,
          with 131,000 miles on it. The assistant notes it.
      - id: van-jerome-test-drive-ask
        channel: email
        at: 2026-08-24T21:50:00
        from: jerome
        to: [argus]
        reply_to: van-jerome-offer
        what: >-
          Jerome thanks Argus for being upfront and asks to test drive the van on Wednesday,
          August 26 at 6:00 pm.
      - id: van-jerome-drive-yes
        channel: email
        at: 2026-08-24T22:05:00
        from: argus
        to: [jerome]
        reply_to: van-jerome-test-drive-ask
        what: Argus says Wednesday at 6:00 works, and the van will be in the driveway.
      - id: van-jerome-drive
        channel: calendar
        at: 2026-08-24T22:00:00
        calendar: personal
        title: Jerome test drives the Odyssey
        start: 2026-08-26T18:00:00
        end: 2026-08-26T19:00:00
        location: Home
        organizer: argus
        attendees: [jerome]
        what: Jerome test drives the old van.
      - id: van-jerome-counter
        channel: email
        at: 2026-08-27T12:30:00
        from: jerome
        to: [argus]
        reply_to: van-jerome-test-drive-ask
        what: >-
          Jerome had his mechanic look at the van. Given the transmission, he offers $9,000, and
          he can take it whenever Argus has his new van.
      - id: van-deal
        channel: email
        at: 2026-08-27T19:45:00
        from: argus
        to: [jerome]
        reply_to: van-jerome-counter
        what: >-
          Argus accepts $9,000. Their new van arrives Thursday, September 17, so Jerome could
          pick up the Odyssey on Saturday, September 19 at 2:00 pm.
      - id: van-jerome-confirms
        channel: email
        at: 2026-08-28T08:10:00
        from: jerome
        to: [argus]
        reply_to: van-deal
        what: >-
          Jerome says Saturday, September 19 at 2:00 pm works, and he'll bring a cashier's
          check.
      - id: van-jerome-pickup
        channel: calendar
        at: 2026-08-28T08:30:00
        calendar: personal
        title: Jerome picks up the Odyssey
        start: 2026-09-19T14:00:00
        end: 2026-09-19T15:00:00
        location: Home
        organizer: argus
        attendees: [jerome]
        what: Jerome buys and picks up the old van.
      - id: van-sienna-ready
        channel: email
        at: 2026-09-15T14:00:00
        from: megan
        to: [argus]
        cc: [mara]
        reply_to: van-sienna-pickup-set
        what: >-
          Megan says the Sienna has been detailed and is ready for pickup on Thursday at
          5:00 pm, as planned. Bring a driver's license and proof of insurance.
      - id: van-purchase-summary
        channel: email
        at: 2026-09-17T18:15:00
        from: northland
        to: [argus]
        category: updates
        subject: "Welcome to Northland Toyota: your purchase summary"
        what: >-
          An automated purchase summary from Northland Toyota: 2022 Toyota Sienna XLE, $36,500,
          $500 deposit applied, plates and registration handed over at pickup. The first free
          maintenance visit is at 5,000 miles. Sign it as Northland Toyota, with no individual
          staff names.
      - id: van-sienna-note
        channel: note
        date: 2026-09-17
        heading: Van
        participants: [mara]
        what: >-
          Picked up the Sienna after work. The kids fought over the third row the whole way home.
      - id: van-spare-key-chat
        channel: assistant_chat
        at: 2026-09-17T21:15:00
        what: >-
          Argus tells the assistant to remember that the Sienna's spare key is in the drawer by
          the back door. The assistant says it will remember.
      - id: van-sold-note
        channel: note
        date: 2026-09-19
        heading: Van
        participants: [jerome]
        what: >-
          Jerome picked up the Odyssey at 2 with a $9,000 cashier's check, and Argus signed over
          the title. Told him about the transmission one more time. Switched the insurance to the
          Sienna. The old van is gone.
      - id: van-jerome-thanks
        channel: email
        at: 2026-09-21T19:00:00
        from: jerome
        to: [argus]
        subject: The van
        what: >-
          Jerome thanks Argus: the van is running fine so far, and his kids love the sliding
          doors.


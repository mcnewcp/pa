        channel: calendar
        at: 2026-04-16T09:00:00
        calendar: personal
        title: "Work trip: Denver"
        start: 2026-04-27
        end: 2026-04-29
        location: Denver, CO
        organizer: argus
        what: Argus is in Denver for a work conference.
      - id: carol-denver-help
        channel: email
        at: 2026-04-24T12:00:00

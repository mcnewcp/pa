          Mara says her mom, Carol, will stay with them Monday to Wednesday while Argus is in
          Denver, to help with the kids around Mara's work.
      - id: work-denver-note
        channel: note
        date: 2026-04-28
        heading: Work
        what: >-
          Second day of the conference in Denver. Good session on data pipelines; dinner with
          the team. Mara handled the insurance inspection at home.

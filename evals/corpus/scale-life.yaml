  - id: family-friends
    title: Family and friends
    summary: >-
      Argus's sister Nell McNevans plans a surprise lunch for their mother Ruth's 70th birthday;
      Mara's mother Carol Lindgren has the kids for a sleepover; Argus goes to a Twins game with
      his friend Dave; Okie and Tasha Okafor's son Malik turns 7; and the neighbors on Linden
      Avenue, organized by Gary Lindqvist, hold their block party.
    events:

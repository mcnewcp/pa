# Scale corpus extension (v0.12): everyday life from mid-April to mid-October 2026, around the
# two long storylines (see scale-basement.yaml for how the extension files fit together):
# replacing the van, the kids' school year and summer, Argus's spring soccer season, Mara's late
# shifts, family and friends, the house, and the daily notes of an ordinary half-year.
#
# Kept clear of what the Argus questions ask about: nothing here is about swim lessons, the
# kitchen remodel, Argus's knee or blood work, Austin, or Dave's wedding; no calendar event lands
# on or after October 15; and every request Argus makes or accepts is closed before the as-of
# time.


# Scale corpus extension (v0.12): the bulk mail (see scale-basement.yaml for how the extension
# files fit together). One background section, expanded with its seed into about 850 dated
# emails from April 15 to October 13, 2026, labelled with Gmail's categories.
#
# The section ends October 13, not 14: its end date is inclusive and mail goes out until 21:59,
# which on the 14th could pass the 20:00 as-of time.
#
# Kinds are chosen so bulk mail can't change an answer: no swim lessons, YMCA, airlines, hotels,
# wedding registries, kitchen remodels, medical results, or booking details; and LakeStays, whose
# mail is the abstention question's decoy, sends only marketing. The storyline Updates that
# matter (claim notices, order and appointment confirmations) are storyline events, not bulk.

background:
  - id: bulk
    title: Bulk mail
    summary: >-
      The offers, newsletters, social notifications, account alerts, and forum digests that fill
      Argus McNevans's inbox. Argus and his wife Mara live in Minneapolis with their kids Theo (7)
      and June (4).
    seed: 1214
    start: 2026-04-15
    end: 2026-10-13
    senders:
      # Promotions --------------------------------------------------------------------------------
      - id: northpoint
        name: Northpoint Market
        email: deals@northpointmarket.example
        category: promotions
        per_week: 3.5
        kinds: [weekly grocery ad, digital coupon roundup, weekend flash sale]
      - id: lakeland-hardware
        name: Lakeland Hardware
        email: offers@lakelandhardware.example
        category: promotions
        per_week: 1.5
        kinds: [lawn and garden sale, tool deals of the week, seasonal clearance]
